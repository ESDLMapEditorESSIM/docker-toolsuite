global:
  domainExtension: example.com

  mongodb:
    hostname: mongodb
    port: 27017

essim:
  image:
    repository: esdlmapeditoressim/essim
    tag: latest
  imagePullSecret: ""

  env:
    GRAFANA_ADMIN_PASSWORD: "admin"
    GRAFANA_ADMIN_USER: "admin"
    GRAFANA_EXTERNAL_URL: "https://essim-dashboard.{{ .Values.global.domainExtension }}"
    GRAFANA_INTERNAL_URL: "http://grafana:3000"
    HTTP_SERVER_HOSTNAME: "0.0.0.0"
    HTTP_SERVER_PATH: "essim"
    HTTP_SERVER_PORT: "8112"
    HTTP_SERVER_SCHEME: "http"
    LOG_LEVEL: "debug"
    MONGODB_HOST: "{{ .Values.global.mongodb.hostname }}"
    MONGODB_PORT: "{{ .Values.global.mongodb.port }}"

apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: esdl-mapeditor
  namespace: my-custom-mapeditor
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`mapeditor.example.com`)
      kind: Rule
      services:
        - name: esdl-mapeditor
          port: 8111
  tls:
    secretName: mapeditor-tls-secret
